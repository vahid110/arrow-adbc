name: PgWire Development Package

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pgwire-core-redshift
    paths:
      - ".github/workflows/pgwire-package.yml"
      - "c/driver/postgresql/**"
      - "c/driver/pgwire/**"
      - "c/driver_manager/**"
      - "c/CMakeLists.txt"
      - "c/cmake_modules/**"
      - "!c/**/*.md"
      - "!c/**/*_test.cc"

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.platform }} development archive
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu24-x86_64
            arch: x86_64
            runner: ubuntu-latest
            image: ubuntu:24.04
          - platform: debian12-x86_64
            arch: x86_64
            runner: ubuntu-latest
            image: debian:bookworm
          - platform: ubuntu24-arm64
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04
    env:
      EXPECTED_ARCH: ${{ matrix.arch }}
      PACKAGE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          apt-get update -o Acquire::Retries=3
          apt-get install --yes build-essential ca-certificates cmake libpq-dev ninja-build pkg-config

      - name: Build and install drivers and manager
        run: |
          cmake -S c -B build/pgwire-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DADBC_BUILD_TESTS=OFF \
            -DADBC_DRIVER_POSTGRESQL=ON \
            -DADBC_DRIVER_MANAGER=ON \
            -DADBC_DRIVER_SQLITE=OFF \
            -DADBC_DRIVER_FLIGHTSQL=OFF
          cmake --build build/pgwire-package --parallel 4
          cmake --install build/pgwire-package --prefix "$RUNNER_TEMP/pgwire-prefix"

      - name: Package, verify, and load from extracted archive
        run: |
          cp LICENSE.txt NOTICE.txt "$RUNNER_TEMP/pgwire-prefix/"
          cp c/driver/pgwire/DEVELOPMENT_PACKAGE.md \
            "$RUNNER_TEMP/pgwire-prefix/README.md"
          artifact_dir="$GITHUB_WORKSPACE/pgwire-artifacts"
          mkdir -p "$artifact_dir"
          archive="adbc-redshift-dev-${PACKAGE_PLATFORM}-${GITHUB_SHA}.tar.gz"
          tar -C "$RUNNER_TEMP/pgwire-prefix" -czf "$artifact_dir/$archive" .
          (cd "$artifact_dir" && sha256sum "$archive" > "$archive.sha256")
          (cd "$artifact_dir" && sha256sum -c "$archive.sha256")
          mkdir "$RUNNER_TEMP/pgwire-package-test"
          tar -C "$RUNNER_TEMP/pgwire-package-test" -xzf "$artifact_dir/$archive"
          test -f "$RUNNER_TEMP/pgwire-package-test/README.md"
          test -f "$RUNNER_TEMP/pgwire-package-test/LICENSE.txt"
          test -f "$RUNNER_TEMP/pgwire-package-test/NOTICE.txt"
          test -f "$RUNNER_TEMP/pgwire-package-test/include/arrow-adbc/driver/redshift.h"
          test -f "$RUNNER_TEMP/pgwire-package-test/lib/libadbc_driver_redshift.so"
          test -f "$RUNNER_TEMP/pgwire-package-test/lib/libadbc_driver_postgresql.so"
          test "$(PKG_CONFIG_PATH="$RUNNER_TEMP/pgwire-package-test/lib/pkgconfig" \
            pkg-config \
            --define-variable=prefix="$RUNNER_TEMP/pgwire-package-test" \
            --variable=libdir adbc-driver-redshift)" = \
            "$RUNNER_TEMP/pgwire-package-test/lib"
          cc -std=c11 -Wall -Wextra -Werror \
            -I "$RUNNER_TEMP/pgwire-package-test/include" \
            c/driver/pgwire/redshift_install_smoke.c \
            -L "$RUNNER_TEMP/pgwire-package-test/lib" \
            -Wl,-rpath,"$RUNNER_TEMP/pgwire-package-test/lib" \
            -ladbc_driver_manager \
            -o "$RUNNER_TEMP/redshift-package-smoke"
          "$RUNNER_TEMP/redshift-package-smoke" \
            "$RUNNER_TEMP/pgwire-package-test/lib/libadbc_driver_redshift.so" \
            --load-only
          "$RUNNER_TEMP/redshift-package-smoke" \
            "$RUNNER_TEMP/pgwire-package-test/lib/libadbc_driver_postgresql.so" \
            'postgresql://postgres:5432/postgres?user=postgres&password=password'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adbc-redshift-dev-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: pgwire-artifacts/

  macos:
    name: macOS ${{ matrix.arch }} development archive
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-latest
    env:
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          brew install --quiet postgresql@18 libpq ninja pkgconf
          echo "$(brew --prefix postgresql@18)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build and install drivers and manager
        run: |
          cmake -S c -B build/pgwire-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DADBC_BUILD_TESTS=OFF \
            -DADBC_DRIVER_POSTGRESQL=ON \
            -DADBC_DRIVER_MANAGER=ON \
            -DADBC_DRIVER_SQLITE=OFF \
            -DADBC_DRIVER_FLIGHTSQL=OFF
          cmake --build build/pgwire-package --parallel 4
          cmake --install build/pgwire-package --prefix "$RUNNER_TEMP/pgwire-prefix"

      - name: Start temporary PostgreSQL 18 server
        run: |
          initdb -D "$RUNNER_TEMP/pgwire-pgdata" --auth=trust --locale=C --no-instructions
          pg_ctl -D "$RUNNER_TEMP/pgwire-pgdata" \
            -o "-h 127.0.0.1 -p 55433" \
            -l "$RUNNER_TEMP/pgwire-postgres.log" start
          echo "ADBC_POSTGRESQL_TEST_URI=postgresql://127.0.0.1:55433/postgres?user=$(whoami)" >> "$GITHUB_ENV"

      - name: Package, verify, and load from extracted archive
        run: |
          cp LICENSE.txt NOTICE.txt "$RUNNER_TEMP/pgwire-prefix/"
          cp c/driver/pgwire/DEVELOPMENT_PACKAGE_MACOS.md \
            "$RUNNER_TEMP/pgwire-prefix/README.md"
          archive="adbc-redshift-dev-macos-${EXPECTED_ARCH}-${GITHUB_SHA}.tar.gz"
          LC_ALL=C tar -C "$RUNNER_TEMP/pgwire-prefix" -czf "$RUNNER_TEMP/$archive" .
          (cd "$RUNNER_TEMP" && LC_ALL=C shasum -a 256 "$archive" > "$archive.sha256")
          (cd "$RUNNER_TEMP" && LC_ALL=C shasum -a 256 -c "$archive.sha256")
          mkdir "$RUNNER_TEMP/pgwire-package-test"
          LC_ALL=C tar -C "$RUNNER_TEMP/pgwire-package-test" -xzf "$RUNNER_TEMP/$archive"
          test -f "$RUNNER_TEMP/pgwire-package-test/README.md"
          test -f "$RUNNER_TEMP/pgwire-package-test/LICENSE.txt"
          test -f "$RUNNER_TEMP/pgwire-package-test/NOTICE.txt"
          test -f "$RUNNER_TEMP/pgwire-package-test/include/arrow-adbc/driver/redshift.h"
          test -f "$RUNNER_TEMP/pgwire-package-test/lib/libadbc_driver_redshift.dylib"
          test -f "$RUNNER_TEMP/pgwire-package-test/lib/libadbc_driver_postgresql.dylib"
          test "$(PKG_CONFIG_PATH="$RUNNER_TEMP/pgwire-package-test/lib/pkgconfig" \
            pkg-config \
            --define-variable=prefix="$RUNNER_TEMP/pgwire-package-test" \
            --variable=libdir adbc-driver-redshift)" = \
            "$RUNNER_TEMP/pgwire-package-test/lib"
          cc -std=c11 -Wall -Wextra -Werror \
            -I "$RUNNER_TEMP/pgwire-package-test/include" \
            c/driver/pgwire/redshift_install_smoke.c \
            -L "$RUNNER_TEMP/pgwire-package-test/lib" \
            -Wl,-rpath,"$RUNNER_TEMP/pgwire-package-test/lib" \
            -ladbc_driver_manager \
            -o "$RUNNER_TEMP/redshift-package-smoke"
          "$RUNNER_TEMP/redshift-package-smoke" \
            "$RUNNER_TEMP/pgwire-package-test/lib/libadbc_driver_redshift.dylib" \
            --load-only
          "$RUNNER_TEMP/redshift-package-smoke" \
            "$RUNNER_TEMP/pgwire-package-test/lib/libadbc_driver_postgresql.dylib" \
            "$ADBC_POSTGRESQL_TEST_URI"

      - name: Stop temporary PostgreSQL 18 server
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/pgwire-pgdata/postmaster.pid"; then
            pg_ctl -D "$RUNNER_TEMP/pgwire-pgdata" stop -m immediate
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adbc-redshift-dev-macos-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/adbc-redshift-dev-macos-${{ matrix.arch }}-*.tar.gz
            ${{ runner.temp }}/adbc-redshift-dev-macos-${{ matrix.arch }}-*.tar.gz.sha256

  windows:
    name: Windows ${{ matrix.arch }} development archive
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            msystem: UCRT64
            msysbin: mingw64
            environment: x86_64
            compiler-package: mingw-w64-x86_64-gcc
            postgres-package: mingw-w64-ucrt-x86_64-postgresql
            triplet: x64-windows-static-release
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            msysbin: clangarm64
            environment: clang-aarch64
            compiler-package: mingw-w64-clang-aarch64-gcc-compat
            postgres-package: mingw-w64-clang-aarch64-postgresql
            triplet: arm64-windows-static-release
    defaults:
      run:
        shell: pwsh
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        id: msys2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: |
            mingw-w64-${{ matrix.environment }}-tools
            ${{ matrix.compiler-package }}
            ${{ matrix.postgres-package }}

      - name: Add msys2 toolchain to PATH
        env:
          MSYS_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "$($env:MSYS_LOCATION)\${{ matrix.msysbin }}\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Ensure vcpkg binary cache directory
        run: |
          New-Item -ItemType Directory -Force `
            $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Restore vcpkg package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('.env', 'ci/vcpkg/**', 'c/**/vcpkg.json', '.github/workflows/native-vcpkg.yml') }}

      - name: Install vcpkg
        shell: bash
        run: ci/scripts/install_vcpkg.sh "$VCPKG_ROOT"

      - name: Install libpq and its static-link dependencies
        working-directory: c
        run: |
          & "$($env:VCPKG_ROOT)\vcpkg.exe" install libpq `
            --overlay-triplets "$pwd\..\ci\vcpkg\triplets"
          if ($LASTEXITCODE -ne 0) { throw "failed to install libpq" }

      - name: Build and install drivers and manager
        run: |
          cmake .\c\ --preset windows-release `
            -DADBC_BUILD_TESTS=OFF `
            -DADBC_DRIVER_FLIGHTSQL=OFF `
            -DADBC_DRIVER_SQLITE=OFF `
            -DVCPKG_OVERLAY_TRIPLETS="$pwd\ci\vcpkg\triplets" `
            "-DVCPKG_TARGET_TRIPLET=$($env:VCPKG_DEFAULT_TRIPLET)"
          if ($LASTEXITCODE -ne 0) { throw "failed to configure CMake" }
          cmake --build .\build\release --target install --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "failed to install drivers" }

      - name: Package, verify, and load from extracted ZIP
        run: |
          $prefix = Join-Path $pwd "local\release"
          $artifactDir = Join-Path $pwd "pgwire-artifacts"
          $licenseDir = Join-Path $prefix "THIRD_PARTY_LICENSES"
          New-Item -Path $artifactDir, $licenseDir `
            -ItemType Directory -Force | Out-Null
          Copy-Item LICENSE.txt, NOTICE.txt -Destination $prefix
          Copy-Item c\driver\pgwire\DEVELOPMENT_PACKAGE_WINDOWS.md `
            -Destination (Join-Path $prefix "README.md")
          $portShare = Join-Path $env:VCPKG_ROOT `
            "installed\$($env:VCPKG_DEFAULT_TRIPLET)\share"
          $copyrights = @(Get-ChildItem $portShare -Filter copyright -File -Recurse)
          if ($copyrights.Count -eq 0) { throw "no vcpkg license texts found" }
          if (-not (Test-Path (Join-Path $portShare "libpq\copyright"))) {
            throw "libpq license text missing"
          }
          foreach ($copyright in $copyrights) {
            Copy-Item -LiteralPath $copyright.FullName `
              -Destination (Join-Path $licenseDir "$($copyright.Directory.Name).txt")
          }
          $archive = "adbc-redshift-dev-windows-$($env:TARGET_ARCH)-$($env:GITHUB_SHA).zip"
          $archivePath = Join-Path $artifactDir $archive
          Compress-Archive -Path (Join-Path $prefix "*") `
            -DestinationPath $archivePath
          $sha = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$archivePath.sha256", `
            "$sha  $archive`n", [System.Text.Encoding]::ASCII)
          if ([System.IO.File]::ReadAllText("$archivePath.sha256").Contains("`r")) {
            throw "checksum file must use LF line endings"
          }
          $expected = (Get-Content -LiteralPath "$archivePath.sha256").Split(' ')[0]
          $actual = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "archive checksum mismatch" }
          $extract = Join-Path $env:RUNNER_TEMP "pgwire-package-test"
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extract
          $driverDll = Join-Path $extract "bin\adbc_driver_redshift.dll"
          if (-not (Test-Path $driverDll)) { throw "Redshift DLL missing" }
          if (-not (Test-Path (Join-Path $extract "README.md"))) {
            throw "README missing"
          }
          if (-not (Test-Path (Join-Path $extract "THIRD_PARTY_LICENSES\libpq.txt"))) {
            throw "libpq license missing from ZIP"
          }
          $cmakeArch = if ($env:TARGET_ARCH -eq "arm64") { "ARM64" } else { "x64" }
          $smokeBuild = Join-Path $env:RUNNER_TEMP "redshift-smoke-build"
          cmake -S .\c\driver\pgwire\install_smoke -B $smokeBuild `
            -A $cmakeArch "-DCMAKE_PREFIX_PATH=$extract"
          if ($LASTEXITCODE -ne 0) { throw "failed to configure extracted client" }
          cmake --build $smokeBuild --config Release
          if ($LASTEXITCODE -ne 0) { throw "failed to build extracted client" }
          $smokeExe = Join-Path $smokeBuild "Release\adbc_redshift_install_smoke.exe"
          $env:PATH = "$(Join-Path $extract 'bin');$env:PATH"
          & $smokeExe $driverDll --load-only
          if ($LASTEXITCODE -ne 0) { throw "failed to load extracted Redshift DLL" }

      - name: Connect extracted clients to temporary PostgreSQL 18
        run: |
          $extract = Join-Path $env:RUNNER_TEMP "pgwire-package-test"
          $smokeExe = Join-Path $env:RUNNER_TEMP "redshift-smoke-build\Release\adbc_redshift_install_smoke.exe"
          $data = Join-Path $env:RUNNER_TEMP "pgwire-pgdata"
          $log = Join-Path $env:RUNNER_TEMP "pgwire-postgres.log"
          $uri = "postgresql://127.0.0.1:55433/postgres?user=postgres"
          & initdb.exe -D $data -A trust -U postgres --no-instructions
          if ($LASTEXITCODE -ne 0) { throw "failed to initialize PostgreSQL" }
          try {
            & pg_ctl.exe -D $data -o "-h 127.0.0.1 -p 55433" -l $log -w start
            if ($LASTEXITCODE -ne 0) { throw "failed to start PostgreSQL" }
            $env:PATH = "$(Join-Path $extract 'bin');$env:PATH"
            $postgresDriver = Join-Path $extract "bin\adbc_driver_postgresql.dll"
            $redshiftDriver = Join-Path $extract "bin\adbc_driver_redshift.dll"
            if (-not (Test-Path $postgresDriver)) { throw "PostgreSQL DLL missing" }
            & $smokeExe $postgresDriver $uri
            if ($LASTEXITCODE -ne 0) { throw "extracted PostgreSQL driver could not connect" }
            & $smokeExe $redshiftDriver $uri --expect-postgresql-rejection
            if ($LASTEXITCODE -ne 0) { throw "extracted Redshift driver did not reject PostgreSQL" }
          } finally {
            if (Test-Path (Join-Path $data "postmaster.pid")) {
              & pg_ctl.exe -D $data -m immediate -w stop
              if ($LASTEXITCODE -ne 0) { throw "failed to stop PostgreSQL" }
            }
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adbc-redshift-dev-windows-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error
          path: pgwire-artifacts/

  verify-downloads:
    name: Verify downloadable archive and checksum pairs
    runs-on: ubuntu-24.04
    needs: [linux, macos, windows]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: adbc-redshift-dev-*
          path: downloaded

      - name: Verify all seven published archive pairs
        run: |
          for platform in ubuntu24-x86_64 debian12-x86_64 ubuntu24-arm64 \
                          macos-x86_64 macos-arm64 windows-x64 windows-arm64; do
            package_dir="downloaded/adbc-redshift-dev-$platform"
            extension=tar.gz
            case "$platform" in windows-*) extension=zip ;; esac
            archive="adbc-redshift-dev-$platform-${GITHUB_SHA}.$extension"
            test -f "$package_dir/$archive"
            test -f "$package_dir/$archive.sha256"
            (cd "$package_dir" && sha256sum -c "$archive.sha256")
          done
