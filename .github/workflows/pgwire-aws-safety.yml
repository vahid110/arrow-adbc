name: PgWire AWS Safety Mocks

on:
  pull_request:
    branches:
      - feature/pgwire-core-redshift
    paths:
      - ".github/workflows/pgwire-aws-safety.yml"
      - ".github/workflows/pgwire-postgresql.yml"
      - "ci/scripts/pgwire_qualification*.py"
      - "ci/scripts/pgwire_local_evidence.py"
      - "ci/scripts/test_pgwire_local_evidence.py"
      - "ci/scripts/pgwire_local_install.py"
      - "ci/scripts/pgwire_local_load_probe.py"
      - "ci/scripts/test_pgwire_local_install.py"
      - "ci/scripts/pgwire_qualification_policy.json"
      - "ci/scripts/test_pgwire_qualification.py"
      - "ci/scripts/test_pgwire_qualification_live.py"
      - "ci/scripts/test_pgwire_qualification_claim.py"
      - ".github/workflows/pgwire-qualification-live.yml"
      - "c/driver/pgwire/redshift_qualification.c"
      - "dev/pgwire/qualification-contract-v1.json"
      - ".github/scripts/pgwire-redshift-ingress.sh"
      - ".github/scripts/test-pgwire-redshift-ingress.sh"
      - ".github/scripts/pgwire-redshift-copy-fixture.sh"
      - ".github/scripts/test-pgwire-redshift-copy-fixture.sh"
  push:
    branches:
      - feature/pgwire-core-redshift
    paths:
      - ".github/workflows/pgwire-aws-safety.yml"
      - ".github/workflows/pgwire-postgresql.yml"
      - "ci/scripts/pgwire_qualification*.py"
      - "ci/scripts/pgwire_local_evidence.py"
      - "ci/scripts/test_pgwire_local_evidence.py"
      - "ci/scripts/pgwire_local_install.py"
      - "ci/scripts/pgwire_local_load_probe.py"
      - "ci/scripts/test_pgwire_local_install.py"
      - "ci/scripts/pgwire_qualification_policy.json"
      - "ci/scripts/test_pgwire_qualification.py"
      - "ci/scripts/test_pgwire_qualification_live.py"
      - "ci/scripts/test_pgwire_qualification_claim.py"
      - ".github/workflows/pgwire-qualification-live.yml"
      - "c/driver/pgwire/redshift_qualification.c"
      - "dev/pgwire/qualification-contract-v1.json"
      - ".github/scripts/pgwire-redshift-ingress.sh"
      - ".github/scripts/test-pgwire-redshift-ingress.sh"
      - ".github/scripts/pgwire-redshift-copy-fixture.sh"
      - ".github/scripts/test-pgwire-redshift-copy-fixture.sh"

concurrency:
  group: pgwire-aws-safety-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanup-mocks:
    name: Exact ingress and staged COPY cleanup (no AWS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install offline test dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes build-essential jq libpq5 python3 python3-venv
          python3 -m venv "$RUNNER_TEMP/safety-venv"
          "$RUNNER_TEMP/safety-venv/bin/python" -m pip install 'boto3==1.42.97'
      - name: Check script syntax
        shell: bash
        run: |
          bash -n .github/scripts/pgwire-redshift-ingress.sh \
            .github/scripts/test-pgwire-redshift-ingress.sh \
            .github/scripts/pgwire-redshift-copy-fixture.sh \
            .github/scripts/test-pgwire-redshift-copy-fixture.sh
      - name: Test temporary ingress cleanup
        shell: bash
        run: |
          bash .github/scripts/test-pgwire-redshift-ingress.sh
      - name: Test staged COPY cleanup
        shell: bash
        run: |
          bash .github/scripts/test-pgwire-redshift-copy-fixture.sh
      - name: Test isolated qualification contract and runner without AWS
        run: '"${{ runner.temp }}/safety-venv/bin/python" -m unittest discover -s ci/scripts -p "test_pgwire_qualification*.py" -v'
      - name: Link synthetic local evidence without execution or AWS
        run: '"${{ runner.temp }}/safety-venv/bin/python" -I -B ci/scripts/test_pgwire_local_evidence.py -v'
      - name: Check synthetic same-host inventories and private load protocol
        run: '"${{ runner.temp }}/safety-venv/bin/python" -I -B ci/scripts/test_pgwire_local_install.py -v'
