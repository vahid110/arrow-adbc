name: PgWire AWS Safety Mocks

on:
  push:
    branches:
      - feature/pgwire-core-redshift
    paths:
      - ".github/workflows/pgwire-aws-safety.yml"
      - ".github/scripts/pgwire-redshift-ingress.sh"
      - ".github/scripts/test-pgwire-redshift-ingress.sh"
      - ".github/scripts/pgwire-redshift-copy-fixture.sh"
      - ".github/scripts/test-pgwire-redshift-copy-fixture.sh"

concurrency:
  group: pgwire-aws-safety-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanup-mocks:
    name: Exact ingress and staged COPY cleanup (no AWS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install offline test dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes jq python3
      - name: Check script syntax
        shell: bash
        run: |
          bash -n .github/scripts/pgwire-redshift-ingress.sh \
            .github/scripts/test-pgwire-redshift-ingress.sh \
            .github/scripts/pgwire-redshift-copy-fixture.sh \
            .github/scripts/test-pgwire-redshift-copy-fixture.sh
      - name: Test temporary ingress cleanup
        shell: bash
        run: |
          bash .github/scripts/test-pgwire-redshift-ingress.sh
      - name: Test staged COPY cleanup
        shell: bash
        run: |
          bash .github/scripts/test-pgwire-redshift-copy-fixture.sh
