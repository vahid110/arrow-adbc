name: PgWire Drivers

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run the one-shot Redshift parameterized-insert benchmark
        required: false
        type: boolean
        default: false
      cancel_test:
        description: Run the bounded Redshift query-cancellation experiment
        required: false
        type: boolean
        default: false
      package_run_id:
        description: Successful same-commit package run to connect its Ubuntu Release archive
        required: false
        type: string
        default: ""
      credential_probe:
        description: Verify non-root Redshift OIDC database identity only (no database connection)
        required: false
        type: boolean
        default: false
      copy_probe:
        description: Manually run a two-row non-root staged COPY fixture with exact cleanup
        required: false
        type: boolean
        default: false
      copy_csv_semantics_probe:
        description: Manually probe nine-row Redshift CSV semantics (staged COPY grant gate)
        required: false
        type: boolean
        default: false
      copy_fixture_selftest:
        description: Run only the staged COPY cleanup mocks on Ubuntu, without AWS
        required: false
        type: boolean
        default: false
      postgresql_only:
        description: Run PostgreSQL and Redshift artifact tests without AWS or live Redshift
        required: false
        type: boolean
        default: false
  push:
    branches:
      - feature/pgwire-core-redshift
    paths:
      - "c/**"
      - "!c/**/*.md"
      - ".github/workflows/pgwire-postgresql.yml"

concurrency:
  group: pgwire-${{ inputs.copy_fixture_selftest && 'copy-selftest' || inputs.postgresql_only && 'postgresql-only' || (inputs.copy_probe || inputs.copy_csv_semantics_probe) && 'copy-dispatch' || inputs.credential_probe && 'credential-probe' || 'postgresql' }}-${{ github.ref }}
  cancel-in-progress: ${{ !(inputs.copy_probe || inputs.copy_csv_semantics_probe) || inputs.copy_fixture_selftest || inputs.postgresql_only }}

permissions:
  contents: read

jobs:
  copy-fixture-selftest:
    name: Staged COPY cleanup mocks (manual only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.copy_fixture_selftest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test cleanup without AWS
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes jq python3
          bash .github/scripts/test-pgwire-redshift-copy-fixture.sh
          bash .github/scripts/test-pgwire-redshift-ingress.sh

  redshift-credential-probe:
    name: Redshift OIDC credential/COPY fixture (manual only)
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.copy_fixture_selftest && !inputs.postgresql_only && (inputs.credential_probe || inputs.copy_probe || inputs.copy_csv_semantics_probe) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pgwire-redshift-copy.yml
    with:
      copy: ${{ inputs.copy_probe }}
      csv_semantics: ${{ inputs.copy_csv_semantics_probe }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  cpp-postgresql:
    name: C++ / PostgreSQL 18 (${{ matrix.platform }})
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.copy_fixture_selftest && (inputs.postgresql_only || (!inputs.credential_probe && !inputs.copy_probe && !inputs.copy_csv_semantics_probe))) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Ubuntu x86-64
            runner: ubuntu-latest
            image: ubuntu:24.04
          - platform: Debian x86-64
            runner: ubuntu-latest
            image: debian:bookworm
          - platform: Ubuntu ARM64
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04
    container: ${{ matrix.image }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      ADBC_POSTGRESQL_TEST_URI: postgresql://postgres:5432/postgres?user=postgres&password=password

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          apt-get update -o Acquire::Retries=3
          apt-get install --yes build-essential ca-certificates cmake git libpq-dev ninja-build pkg-config

      - name: Test staged COPY cleanup without AWS
        if: ${{ matrix.platform == 'Ubuntu x86-64' }}
        run: |
          apt-get install --yes jq python3
          bash .github/scripts/test-pgwire-redshift-copy-fixture.sh
          bash .github/scripts/test-pgwire-redshift-ingress.sh

      - name: Configure
        run: >-
          cmake -S c -B build/pgwire-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DADBC_BUILD_TESTS=ON
          -DADBC_DRIVER_POSTGRESQL=ON
          -DADBC_DRIVER_MANAGER=ON
          -DADBC_DRIVER_SQLITE=OFF
          -DADBC_DRIVER_FLIGHTSQL=OFF
          -DADBC_USE_ASAN=OFF
          -DADBC_USE_UBSAN=OFF

      - name: Build PostgreSQL-wire tests
        run: >-
          cmake --build build/pgwire-ci
          --target adbc-driver-postgresql-test adbc-driver-postgresql-copy-test
          adbc-driver-redshift-test
          --parallel 4

      - name: Run PostgreSQL tests
        run: ctest --test-dir build/pgwire-ci --output-on-failure -L driver-postgresql

      - name: Verify Redshift artifact
        run: ctest --test-dir build/pgwire-ci --output-on-failure -L driver-redshift

      - name: Install and test the Redshift driver through the driver manager
        run: |
          cmake --build build/pgwire-ci --parallel 4
          cmake --install build/pgwire-ci --prefix "$RUNNER_TEMP/pgwire-prefix"
          cc -std=c11 -Wall -Wextra -Werror \
            -I "$RUNNER_TEMP/pgwire-prefix/include" \
            c/driver/pgwire/redshift_install_smoke.c \
            -L "$RUNNER_TEMP/pgwire-prefix/lib" \
            -Wl,-rpath,"$RUNNER_TEMP/pgwire-prefix/lib" \
            -ladbc_driver_manager \
            -o "$RUNNER_TEMP/redshift-install-smoke"
          test -f "$RUNNER_TEMP/pgwire-prefix/include/arrow-adbc/driver/redshift.h"
          test -f "$RUNNER_TEMP/pgwire-prefix/lib/pkgconfig/adbc-driver-redshift.pc"
          test -f "$RUNNER_TEMP/pgwire-prefix/lib/cmake/AdbcDriverRedshift/AdbcDriverRedshiftConfig.cmake"
          PKG_CONFIG_PATH="$RUNNER_TEMP/pgwire-prefix/lib/pkgconfig" \
            pkg-config --exists adbc-driver-redshift
          "$RUNNER_TEMP/redshift-install-smoke" \
            "$RUNNER_TEMP/pgwire-prefix/lib/libadbc_driver_redshift.so" \
            "$ADBC_POSTGRESQL_TEST_URI" --expect-postgresql-rejection

  cpp-macos:
    name: C++ / PostgreSQL 18 (${{ matrix.platform }})
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.copy_fixture_selftest && (inputs.postgresql_only || (!inputs.credential_probe && !inputs.copy_probe && !inputs.copy_csv_semantics_probe))) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Intel
            runner: macos-15-intel
          - platform: macOS Apple Silicon
            runner: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PostgreSQL 18 build dependencies
        run: |
          brew install --quiet postgresql@18 libpq ninja pkgconf
          pg_prefix="$(brew --prefix postgresql@18)"
          echo "$pg_prefix/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Start temporary PostgreSQL server
        run: |
          initdb -D "$RUNNER_TEMP/pgdata" --auth=trust --locale=C --no-instructions
          pg_ctl -D "$RUNNER_TEMP/pgdata" \
            -o "-h 127.0.0.1 -p 55433" \
            -l "$RUNNER_TEMP/postgres.log" start
          echo "ADBC_POSTGRESQL_TEST_URI=postgresql://127.0.0.1:55433/postgres?user=$(whoami)" >> "$GITHUB_ENV"

      - name: Configure and build
        run: |
          cmake -S c -B build/pgwire-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DADBC_BUILD_TESTS=ON \
            -DADBC_DRIVER_POSTGRESQL=ON \
            -DADBC_DRIVER_MANAGER=ON \
            -DADBC_DRIVER_SQLITE=OFF \
            -DADBC_DRIVER_FLIGHTSQL=OFF \
            -DADBC_USE_ASAN=OFF \
            -DADBC_USE_UBSAN=OFF
          cmake --build build/pgwire-ci --parallel 4

      - name: Run PostgreSQL and Redshift artifact tests
        run: |
          ctest --test-dir build/pgwire-ci --output-on-failure -L driver-postgresql
          ctest --test-dir build/pgwire-ci --output-on-failure -L driver-redshift

      - name: Install and test the Redshift driver through the driver manager
        run: |
          cmake --install build/pgwire-ci --prefix "$RUNNER_TEMP/pgwire-prefix"
          cc -std=c11 -Wall -Wextra -Werror \
            -I "$RUNNER_TEMP/pgwire-prefix/include" \
            c/driver/pgwire/redshift_install_smoke.c \
            -L "$RUNNER_TEMP/pgwire-prefix/lib" \
            -Wl,-rpath,"$RUNNER_TEMP/pgwire-prefix/lib" \
            -ladbc_driver_manager \
            -o "$RUNNER_TEMP/redshift-install-smoke"
          test -f "$RUNNER_TEMP/pgwire-prefix/include/arrow-adbc/driver/redshift.h"
          PKG_CONFIG_PATH="$RUNNER_TEMP/pgwire-prefix/lib/pkgconfig" \
            pkg-config --exists adbc-driver-redshift
          "$RUNNER_TEMP/redshift-install-smoke" \
            "$RUNNER_TEMP/pgwire-prefix/lib/libadbc_driver_redshift.dylib" \
            "$ADBC_POSTGRESQL_TEST_URI" --expect-postgresql-rejection

      - name: Stop temporary PostgreSQL server
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/pgdata/postmaster.pid"; then
            pg_ctl -D "$RUNNER_TEMP/pgdata" stop -m immediate
          fi

  cpp-redshift:
    name: C++ / Redshift Serverless
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.postgresql_only && !inputs.copy_fixture_selftest && !inputs.credential_probe && !inputs.copy_probe && !inputs.copy_csv_semantics_probe) }}
    needs: [cpp-postgresql, cpp-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write

    env:
      AWS_REGION: eu-central-1
      REDSHIFT_SECURITY_GROUP_ID: sg-00551344e2efb9c68

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes build-essential ca-certificates cmake jq libpq-dev ninja-build pkg-config

      - name: Configure
        run: >-
          cmake -S c -B build/pgwire-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DADBC_BUILD_TESTS=ON
          -DADBC_DRIVER_POSTGRESQL=ON
          -DADBC_DRIVER_MANAGER=ON
          -DADBC_DRIVER_SQLITE=OFF
          -DADBC_DRIVER_FLIGHTSQL=OFF
          -DADBC_USE_ASAN=OFF
          -DADBC_USE_UBSAN=OFF

      - name: Build Redshift tests
        run: cmake --build build/pgwire-ci --parallel 4

      - name: Package and relocate Redshift client artifact
        run: |
          cmake --install build/pgwire-ci --prefix "$RUNNER_TEMP/pgwire-prefix"
          tar -C "$RUNNER_TEMP/pgwire-prefix" -czf "$RUNNER_TEMP/pgwire-live.tar.gz" .
          mkdir "$RUNNER_TEMP/pgwire-relocated"
          tar -C "$RUNNER_TEMP/pgwire-relocated" -xzf "$RUNNER_TEMP/pgwire-live.tar.gz"
          test -f "$RUNNER_TEMP/pgwire-relocated/lib/libadbc_driver_redshift.so"
          cc -std=c11 -Wall -Wextra -Werror \
            -I "$RUNNER_TEMP/pgwire-relocated/include" \
            c/driver/pgwire/redshift_install_smoke.c \
            -L "$RUNNER_TEMP/pgwire-relocated/lib" \
            -Wl,-rpath,"$RUNNER_TEMP/pgwire-relocated/lib" \
            -ladbc_driver_manager \
            -o "$RUNNER_TEMP/redshift-install-smoke"

      - name: Prepare downloaded Release archive (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          [[ "$PACKAGE_RUN_ID" =~ ^[0-9]+$ ]]
          package_run="$(gh run view "$PACKAGE_RUN_ID" -R "$GITHUB_REPOSITORY" \
            --json name,conclusion,headSha)"
          test "$(jq -r '.name' <<< "$package_run")" = 'PgWire Development Package'
          test "$(jq -r '.conclusion' <<< "$package_run")" = 'success'
          test "$(jq -r '.headSha' <<< "$package_run")" = "$GITHUB_SHA"
          archive_dir="$RUNNER_TEMP/pgwire-release-download"
          mkdir "$archive_dir"
          gh run download "$PACKAGE_RUN_ID" -R "$GITHUB_REPOSITORY" \
            -n adbc-redshift-dev-ubuntu24-x86_64 -D "$archive_dir"
          (cd "$archive_dir" && sha256sum -c ./*.sha256)
          archive="$archive_dir/adbc-redshift-dev-ubuntu24-x86_64-${GITHUB_SHA}.tar.gz"
          test -f "$archive"
          mkdir "$RUNNER_TEMP/pgwire-release-extracted"
          tar -C "$RUNNER_TEMP/pgwire-release-extracted" -xzf "$archive"
          test -f "$RUNNER_TEMP/pgwire-release-extracted/LICENSE.txt"
          test -f "$RUNNER_TEMP/pgwire-release-extracted/NOTICE.txt"
          test -f "$RUNNER_TEMP/pgwire-release-extracted/lib/libadbc_driver_redshift.so"
          cc -std=c11 -Wall -Wextra -Werror \
            -I "$RUNNER_TEMP/pgwire-release-extracted/include" \
            c/driver/pgwire/redshift_install_smoke.c \
            -L "$RUNNER_TEMP/pgwire-release-extracted/lib" \
            -Wl,-rpath,"$RUNNER_TEMP/pgwire-release-extracted/lib" \
            -ladbc_driver_manager \
            -o "$RUNNER_TEMP/redshift-release-smoke"

      - name: Configure temporary AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Resolve runner address
        id: runner-address
        run: |
          runner_ip="$(curl --fail --silent --show-error --retry 3 https://checkip.amazonaws.com | tr -d '[:space:]')"
          python3 -c 'import ipaddress,sys; address=ipaddress.ip_address(sys.argv[1]); assert address.version == 4' "$runner_ip"
          echo "::add-mask::$runner_ip"
          echo "cidr=$runner_ip/32" >> "$GITHUB_OUTPUT"

      - name: Open temporary Redshift ingress
        id: ingress
        env:
          RUNNER_CIDR: ${{ steps.runner-address.outputs.cidr }}
        run: bash .github/scripts/pgwire-redshift-ingress.sh open

      - name: Run live Redshift tests
        env:
          ADBC_REDSHIFT_TEST_URI: ${{ secrets.ADBC_REDSHIFT_TEST_URI }}
        run: >-
          build/pgwire-ci/driver/postgresql/adbc-driver-postgresql-test
          --gtest_filter='RedshiftSmokeTest.*'

      - name: Benchmark parameterized inserts (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark }}
        env:
          ADBC_REDSHIFT_TEST_URI: ${{ secrets.ADBC_REDSHIFT_TEST_URI }}
          ADBC_REDSHIFT_BENCHMARK: "1"
        run: >-
          build/pgwire-ci/driver/postgresql/adbc-driver-postgresql-test
          --gtest_filter='RedshiftBenchmarkTest.*'

      - name: Qualify Redshift query cancellation (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cancel_test }}
        env:
          ADBC_REDSHIFT_TEST_URI: ${{ secrets.ADBC_REDSHIFT_TEST_URI }}
          ADBC_REDSHIFT_CANCEL_TEST: "1"
        run: >-
          build/pgwire-ci/driver/postgresql/adbc-driver-postgresql-test
          --gtest_filter='RedshiftCancelTest.*'

      - name: Connect through relocated Redshift driver manager
        env:
          ADBC_REDSHIFT_TEST_URI: ${{ secrets.ADBC_REDSHIFT_TEST_URI }}
        run: >-
          "$RUNNER_TEMP/redshift-install-smoke"
          "$RUNNER_TEMP/pgwire-relocated/lib/libadbc_driver_redshift.so"
          "$ADBC_REDSHIFT_TEST_URI"

      - name: Connect through downloaded Release archive (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_run_id != '' }}
        env:
          ADBC_REDSHIFT_TEST_URI: ${{ secrets.ADBC_REDSHIFT_TEST_URI }}
        run: >-
          "$RUNNER_TEMP/redshift-release-smoke"
          "$RUNNER_TEMP/pgwire-release-extracted/lib/libadbc_driver_redshift.so"
          "$ADBC_REDSHIFT_TEST_URI"

      - name: Close temporary Redshift ingress
        if: ${{ always() && steps.aws-credentials.outcome == 'success' }}
        run: bash .github/scripts/pgwire-redshift-ingress.sh cleanup
