name: PgWire Native Daily

# The full Apache native matrices (Unix incl. macOS/Conda, Windows) take 30-60
# minutes, so this fork runs them once a day on the integration branch instead
# of gating every PR. The coordinator dispatches this workflow every 24 hours.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    uses: ./.github/workflows/native-unix.yml  # zizmor: ignore[self-repository]
  windows:
    uses: ./.github/workflows/native-windows.yml  # zizmor: ignore[self-repository]
