name: PgWire Redshift COPY Fixture

# Credentials-only is the safe default. The opt-in COPY path remains gated
# until the CI role's exact-prefix s3:GetObject permission is reviewed and the
# fixture's PGWIRE_COPY_GETOBJECT_VERIFIED assertion is deliberately enabled.
# A hard runner loss can bypass both the shell trap and always() cleanup. After
# each copy=true run, separately audit the dedicated security group for its
# printed adbc-pgwire-copy-<run ID>-<attempt> description. Revoke only a rule
# whose ID, group, port, exact /32, and description all match that run; inspect
# staging/ci/<run ID>-<attempt>/ for any objects left behind.
on:
  workflow_dispatch:
    inputs:
      copy:
        description: Stage and COPY a two-row fixture (requires reviewed narrow trust)
        required: false
        type: boolean
        default: false
      csv_semantics:
        description: Stage and COPY nine small CSV semantics rows (requires cleanup grant)
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      copy:
        required: false
        type: boolean
        default: false
      csv_semantics:
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ROLE_ARN:
        required: true

concurrency:
  group: pgwire-redshift-copy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  fixture:
    name: Verify temporary non-root database identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: eu-central-1
      AWS_ACCOUNT_ID: "149112076833"
      REDSHIFT_WORKGROUP: pgwire-ci
      REDSHIFT_DBNAME: dev
      REDSHIFT_HOST: pgwire-ci.149112076833.eu-central-1.redshift-serverless.amazonaws.com
      REDSHIFT_SECURITY_GROUP_ID: sg-00551344e2efb9c68
      REDSHIFT_COPY_BUCKET: adbc-pgwire-ci-149112076833-euc1
      REDSHIFT_COPY_ROLE_ARN: arn:aws:iam::149112076833:role/adbc-pgwire-ci-copy

    steps:
      - name: Validate mutually exclusive COPY modes
        if: ${{ inputs.copy && inputs.csv_semantics }}
        run: |
          echo '::error::Choose either the two-row COPY fixture or CSV semantics probe, not both.'
          exit 1

      - name: Check out COPY fixture script
        if: ${{ inputs.copy || inputs.csv_semantics }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        if: ${{ inputs.copy || inputs.csv_semantics }}
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes postgresql-client

      - name: Configure temporary AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Verify temporary non-root database credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          caller="$(aws sts get-caller-identity --query Arn --output text)"
          [[ "$caller" == "arn:aws:sts::${AWS_ACCOUNT_ID}:assumed-role/adbc-redshift-ci/"* ]]
          db_user="$(aws redshift-serverless get-credentials \
            --workgroup-name "$REDSHIFT_WORKGROUP" \
            --duration-seconds 900 --query dbUser --output text)"
          [[ "$db_user" == IAMR:* ]]
          printf 'Verified temporary Redshift database user: %s\n' "$db_user"

      - name: Qualify staged COPY fixture
        if: ${{ inputs.copy || inputs.csv_semantics }}
        shell: bash
        env:
          CSV_SEMANTICS: ${{ inputs.csv_semantics }}
        run: |
          if [[ "$CSV_SEMANTICS" == true ]]; then
            bash .github/scripts/pgwire-redshift-copy-fixture.sh csv-semantics
          else
            bash .github/scripts/pgwire-redshift-copy-fixture.sh run
          fi

      - name: Reconcile exact COPY fixture resources
        if: ${{ always() && (inputs.copy || inputs.csv_semantics) && steps.aws-credentials.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pgwire-redshift-copy-fixture.sh cleanup
