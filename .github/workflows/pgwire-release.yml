name: PgWire Redshift Release

# A redshift-v<version> tag push builds the seven checked archives through
# pgwire-package.yml, repackages them with the version and an ADBC driver
# manifest, and creates a DRAFT GitHub Release. Publishing the draft is a
# manual step. A workflow_dispatch (dry_run=true) or a pull request touching
# this file builds the same assets and uploads them only as a workflow artifact.
on:
  push:
    tags:
      - "redshift-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the release assets without creating a release (only a tag push creates one)
        required: false
        type: boolean
        default: true
  pull_request:
    branches:
      - feature/pgwire-core-redshift
    paths:
      - ".github/workflows/pgwire-release.yml"

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version from tag or commit
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#redshift-v}"
            if ! printf '%s\n' "$version" |
                grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::tag $REF_NAME is not redshift-v<MAJOR>.<MINOR>.<PATCH>[-<pre>]"
              exit 1
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::releases are created only by pushing a redshift-v* tag; rerun with dry_run=true"
            exit 1
          else
            version="0.0.0-dev+${GITHUB_SHA:0:12}"
          fi
          echo "Release version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: Build checked archives
    permissions:
      contents: read
    uses: ./.github/workflows/pgwire-package.yml  # zizmor: ignore[self-repository]

  assemble:
    name: Assemble release assets
    runs-on: ubuntu-24.04
    needs: [version, package]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: adbc-redshift-dev-*
          path: downloaded

      - name: Repackage archives with version and driver manifest
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$out"
          for platform in ubuntu24-x86_64 debian12-x86_64 ubuntu24-arm64 \
                          macos-x86_64 macos-arm64 windows-x64 windows-arm64; do
            case "$platform" in
              ubuntu24-x86_64|debian12-x86_64)
                tuple=linux_amd64; lib=lib/libadbc_driver_redshift.so ;;
              ubuntu24-arm64)
                tuple=linux_arm64; lib=lib/libadbc_driver_redshift.so ;;
              macos-x86_64)
                tuple=macos_amd64; lib=lib/libadbc_driver_redshift.dylib ;;
              macos-arm64)
                tuple=macos_arm64; lib=lib/libadbc_driver_redshift.dylib ;;
              windows-x64)
                tuple=windows_amd64; lib=bin/adbc_driver_redshift.dll ;;
              windows-arm64)
                tuple=windows_arm64; lib=bin/adbc_driver_redshift.dll ;;
            esac
            extension=tar.gz
            case "$platform" in windows-*) extension=zip ;; esac

            # Inputs: the archive/checksum pair pgwire-package.yml verified.
            src_dir="downloaded/adbc-redshift-dev-$platform"
            src="adbc-redshift-dev-$platform-$GITHUB_SHA.$extension"
            (cd "$src_dir" && sha256sum -c "$src.sha256")

            name="adbc-driver-redshift-$VERSION-$platform"
            root="$RUNNER_TEMP/stage/$name"
            mkdir -p "$root"
            if [ "$extension" = zip ]; then
              unzip -q "$src_dir/$src" -d "$root"
            else
              tar -C "$root" -xzf "$src_dir/$src"
            fi
            test -f "$root/$lib"
            test -f "$root/include/arrow-adbc/driver/redshift.h"
            test -f "$root/LICENSE.txt"
            test -f "$root/NOTICE.txt"
            case "$platform" in
              windows-*) test -f "$root/THIRD_PARTY_LICENSES/libpq.txt" ;;
            esac

            # The driver manager passes Driver.shared to dlopen()/LoadLibrary()
            # unchanged, so the path must be absolute and is filled in at install.
            manifest_lib="@PREFIX@/$lib"
            case "$platform" in windows-*) manifest_lib="${manifest_lib//\//\\}" ;; esac
            {
              echo "# ADBC driver manifest for the Redshift driver."
              echo "# Driver.shared must be an absolute path. Replace @PREFIX@ with the"
              echo "# absolute path of the directory that holds this file, then copy the"
              echo "# file into an ADBC driver search directory (for example one listed in"
              echo "# ADBC_DRIVER_PATH) to load the driver by the name \"redshift\"."
              echo "manifest_version = 1"
              echo
              echo "name = 'ADBC Redshift Driver'"
              echo "version = '$VERSION'"
              echo "publisher = 'vahid110/arrow-adbc'"
              echo "license = 'Apache-2.0'"
              echo "url = 'https://github.com/vahid110/arrow-adbc'"
              echo
              echo "[ADBC]"
              echo "version = '1.1.0'"
              echo
              echo "[Driver]"
              echo "entrypoint = 'AdbcDriverRedshiftInit'"
              echo
              echo "[Driver.shared]"
              echo "$tuple = '$manifest_lib'"
            } > "$root/redshift.toml"

            if [ "$extension" = zip ]; then
              (cd "$RUNNER_TEMP/stage" && zip -q -r -X "$out/$name.zip" "$name")
            else
              tar -C "$RUNNER_TEMP/stage" --sort=name --owner=0 --group=0 \
                --numeric-owner -czf "$out/$name.tar.gz" "$name"
            fi
          done
          (cd "$out" && sha256sum adbc-driver-redshift-*.tar.gz adbc-driver-redshift-*.zip > SHA256SUMS)
          (cd "$out" && sha256sum -c SHA256SUMS)
          test "$(wc -l < "$out/SHA256SUMS")" -eq 7
          cat "$out/SHA256SUMS"
          for archive in "$out"/*.tar.gz; do
            echo "== $(basename "$archive")"; tar -tzf "$archive"
          done
          for archive in "$out"/*.zip; do
            echo "== $(basename "$archive")"; unzip -Z1 "$archive"
          done

      - name: Load the Linux x86_64 driver by name through its manifest
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes libpq5
          test_dir="$RUNNER_TEMP/manifest-test"
          mkdir -p "$test_dir/install" "$test_dir/drivers"
          tar -C "$test_dir/install" -xzf \
            "release-assets/adbc-driver-redshift-$VERSION-ubuntu24-x86_64.tar.gz"
          prefix="$test_dir/install/adbc-driver-redshift-$VERSION-ubuntu24-x86_64"
          sed "s|@PREFIX@|$prefix|" "$prefix/redshift.toml" > "$test_dir/drivers/redshift.toml"
          cat "$test_dir/drivers/redshift.toml"
          cat > "$test_dir/find_load.c" <<'EOF'
          #include <stdio.h>

          #include <arrow-adbc/adbc.h>
          #include <arrow-adbc/adbc_driver_manager.h>

          int main(void) {
            struct AdbcError error = ADBC_ERROR_INIT;
            struct AdbcDriver driver = {0};
            AdbcStatusCode status =
                AdbcFindLoadDriver("redshift", NULL, ADBC_VERSION_1_1_0,
                                   ADBC_LOAD_FLAG_SEARCH_ENV, NULL, &driver, &error);
            if (status != ADBC_STATUS_OK) {
              fprintf(stderr, "could not load redshift by name (status %d): %s\n",
                      (int)status, error.message ? error.message : "no message");
              if (error.release) error.release(&error);
              return 1;
            }
            if (driver.release && driver.release(&driver, &error) != ADBC_STATUS_OK) {
              return 1;
            }
            puts("loaded the redshift driver by name through redshift.toml");
            return 0;
          }
          EOF
          cc -std=c11 -Wall -Wextra -Werror -I "$prefix/include" \
            "$test_dir/find_load.c" -L "$prefix/lib" -Wl,-rpath,"$prefix/lib" \
            -ladbc_driver_manager -o "$test_dir/find_load"
          ADBC_DRIVER_PATH="$test_dir/drivers" "$test_dir/find_load"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adbc-driver-redshift-release-assets
          retention-days: 7
          if-no-files-found: error
          path: release-assets/

  release:
    name: Create draft GitHub Release
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    needs: [version, assemble]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: adbc-driver-redshift-release-assets
          path: release-assets

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          notes="ADBC Redshift driver $VERSION.

          Each archive holds the Redshift driver library, its public header, the
          ADBC driver manager, LICENSE.txt, NOTICE.txt, a README and redshift.toml
          (an ADBC driver manifest; set its @PREFIX@ to the extracted directory).
          Windows archives add THIRD_PARTY_LICENSES for statically linked libpq.
          Verify downloads with: sha256sum -c SHA256SUMS"
          # Always a draft: publishing is a manual, reviewed step.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            "${prerelease[@]}" \
            --title "ADBC Redshift driver $VERSION" \
            --notes "$notes" \
            SHA256SUMS adbc-driver-redshift-*.tar.gz adbc-driver-redshift-*.zip
