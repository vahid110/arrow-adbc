name: PgWire Redshift Release

# A redshift-v<version> tag push builds the seven checked archives through
# pgwire-package.yml and the five tested adbc_driver_redshift wheels through
# pgwire-python-wheels.yml, repackages the archives with the version and an
# ADBC driver manifest, and creates a DRAFT GitHub Release. Publishing the
# draft is a manual step. A workflow_dispatch (dry_run=true) or a pull request
# touching this file, pgwire-package.yml or the manifest smoke client builds
# the same assets and uploads them only as a workflow artifact. The binaries
# are built with the release version (dry runs: 0.0.0-dev+<commit>); the wheels
# use its PEP 440 form (1.2.3-rc.1 -> 1.2.3rc1; dry runs 0.0.0.dev0+g<commit>).
# Tag runs rebuild the Windows vcpkg dependencies instead of restoring them
# from the cache.
on:
  push:
    tags:
      - "redshift-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the release assets without creating a release (only a tag push creates one)
        required: false
        type: boolean
        default: true
  pull_request:
    branches:
      - feature/pgwire-core-redshift
    paths:
      - ".github/workflows/pgwire-release.yml"
      - ".github/workflows/pgwire-package.yml"
      - "c/driver/pgwire/install_smoke/**"
      - "c/driver/pgwire/redshift_manifest_smoke.c"

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      python_version: ${{ steps.version.outputs.python_version }}
    steps:
      - name: Resolve version from tag or commit
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#redshift-v}"
            if ! printf '%s\n' "$version" |
                grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
              echo "::error::tag $REF_NAME is not redshift-v<MAJOR>.<MINOR>.<PATCH>[-<pre>]"
              exit 1
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::releases are created only by pushing a redshift-v* tag; rerun with dry_run=true"
            exit 1
          else
            version="0.0.0-dev+${GITHUB_SHA:0:12}"
          fi
          # PEP 440 wheel version: a/alpha, b/beta and rc pre-releases map to
          # 1.2.3a1, 1.2.3b1, 1.2.3rc1; other pre-release tags are rejected.
          base="${version%%[-+]*}"
          if [ "$version" = "$base" ]; then
            python_version="$base"
          elif [ "$version" = "0.0.0-dev+${GITHUB_SHA:0:12}" ]; then
            python_version="0.0.0.dev0+g${GITHUB_SHA:0:12}"
          elif [[ "${version#"$base"-}" =~ ^(a|alpha|b|beta|rc)\.?([0-9]+)$ ]]; then
            case "${BASH_REMATCH[1]}" in
              a|alpha) pre=a ;;
              b|beta) pre=b ;;
              *) pre=rc ;;
            esac
            python_version="$base$pre${BASH_REMATCH[2]}"
          else
            echo "::error::pre-release $version has no PEP 440 form; use -alpha.N, -beta.N or -rc.N"
            exit 1
          fi
          echo "Release version: $version (wheels: $python_version)"
          {
            echo "version=$version"
            echo "python_version=$python_version"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Build checked archives
    needs: [version]
    permissions:
      contents: read
    uses: ./.github/workflows/pgwire-package.yml  # zizmor: ignore[self-repository]
    with:
      version: ${{ needs.version.outputs.version }}
      # Release binaries never come from a restored vcpkg binary cache.
      use_cache: ${{ !(github.event_name == 'push' && github.ref_type == 'tag') }}

  wheels:
    name: Build and test Python wheels
    needs: [version]
    permissions:
      contents: read
    uses: ./.github/workflows/pgwire-python-wheels.yml  # zizmor: ignore[self-repository]
    with:
      version: ${{ needs.version.outputs.version }}
      python_version: ${{ needs.version.outputs.python_version }}

  assemble:
    name: Assemble release assets
    runs-on: ubuntu-24.04
    needs: [version, package, wheels]
    env:
      PYTHON_VERSION: ${{ needs.version.outputs.python_version }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: adbc-redshift-dev-*
          path: downloaded

      # pgwire-python-wheels.yml verified the names, tags and versions.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: adbc-redshift-wheel-*
          path: downloaded-wheels
          merge-multiple: true

      - name: Repackage archives with version and driver manifest
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$out"
          # Deterministic packaging: entries sorted, owner 0, normalised modes,
          # every mtime set to the commit time, no gzip name/timestamp, no zip
          # extra fields. The same inputs give byte-identical archives.
          epoch="$(git log -1 --format=%ct HEAD)"
          echo "Archive mtime: $epoch ($(date -u -d "@$epoch" +%FT%TZ))"
          pack() {  # pack <parent dir> <top-level name> <output file>
            find "$1/$2" -exec touch -h -d "@$epoch" {} +
            chmod -R u+rwX,go+rX,go-w "$1/$2"
            case "$3" in
              *.zip)
                (cd "$1" && find "$2" -print | LC_ALL=C sort |
                  TZ=UTC zip -q -X -@ "$3") ;;
              *)
                tar -C "$1" --sort=name --format=gnu --owner=0 --group=0 \
                  --numeric-owner --mtime="@$epoch" -cf - "$2" | gzip -n -9 > "$3" ;;
            esac
          }
          # Release README: the development README of the same OS with the
          # development disclaimer removed, a release header added and the
          # archive and checksum names switched to the release assets.
          export NOTES_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/redshift-v$VERSION"
          cat > "$RUNNER_TEMP/release_readme.py" <<'EOF'
          import os
          import re
          import sys

          path = sys.argv[1]
          version = os.environ["VERSION"]
          notes = os.environ["NOTES_URL"]
          with open(path, encoding="utf-8") as f:
              text = f.read()


          def sub(pattern, repl, required=False):
              global text
              text, n = re.subn(pattern, repl, text, flags=re.M)
              if required and n == 0:
                  sys.exit(f"{path}: README no longer matches {pattern!r}")


          sub(r"^# ADBC Redshift development archive \((\w+)\)\n",
              lambda m: f"# ADBC Redshift driver {version} ({m[1]})\n\n"
              f"Release {version} of the ADBC Redshift driver. Release notes:\n"
              f"<{notes}>\n", required=True)
          sub(r"This is a short-lived CI build for evaluation, \*\*not a production"
              r" release\*\* or\n[^.]*guarantee\. ", "", required=True)
          sub(r"adbc-redshift-dev-(macos-<arch>|windows-<arch>|<platform>)-<commit>",
              lambda m: f"adbc-driver-redshift-{version}-{m[1]}", required=True)
          sub(r"^((?:LC_ALL=C )?(?:sha256sum|shasum -a 256)) -c (\S+)\.sha256$",
              r"grep ' \2$' SHA256SUMS | \1 -c")
          sub(re.escape('$expected = (Get-Content "$archive.sha256").Split(\' \')[0]'),
              lambda m: '$expected = (Get-Content SHA256SUMS |\n'
              '  Where-Object { $_.EndsWith(" $archive") }).Split(\' \')[0]')
          sub(r"The workflow publishes a ZIP and adjacent SHA-256 file\.",
              "The release lists the SHA-256 of every archive in `SHA256SUMS`.")
          sub(r"the adjacent checksum file:", "it against the release's `SHA256SUMS`:")
          sub(r"adbc-redshift-dev\b", "adbc-driver-redshift")
          sub(r"Release archives \(`adbc-driver-redshift-<version>-<platform>`\)"
              r" also contain", "This archive also contains", required=True)
          sub(r"development archive", "archive")
          sub(r"The development driver", "The driver")
          for banned in ("not a production release", "development archive",
                         "short-lived", "adbc-redshift-dev", ".sha256",
                         "development driver"):
              if banned in text:
                  sys.exit(f"{path}: release README still contains {banned!r}")
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          EOF
          for platform in ubuntu24-x86_64 debian12-x86_64 ubuntu24-arm64 \
                          macos-x86_64 macos-arm64 windows-x64 windows-arm64; do
            case "$platform" in
              ubuntu24-x86_64|debian12-x86_64)
                tuple=linux_amd64; lib=lib/libadbc_driver_redshift.so ;;
              ubuntu24-arm64)
                tuple=linux_arm64; lib=lib/libadbc_driver_redshift.so ;;
              macos-x86_64)
                tuple=macos_amd64; lib=lib/libadbc_driver_redshift.dylib ;;
              macos-arm64)
                tuple=macos_arm64; lib=lib/libadbc_driver_redshift.dylib ;;
              windows-x64)
                tuple=windows_amd64; lib=bin/adbc_driver_redshift.dll ;;
              windows-arm64)
                tuple=windows_arm64; lib=bin/adbc_driver_redshift.dll ;;
            esac
            extension=tar.gz
            case "$platform" in windows-*) extension=zip ;; esac

            # Inputs: the archive/checksum pair pgwire-package.yml verified.
            src_dir="downloaded/adbc-redshift-dev-$platform"
            src="adbc-redshift-dev-$platform-$GITHUB_SHA.$extension"
            (cd "$src_dir" && sha256sum -c "$src.sha256")

            name="adbc-driver-redshift-$VERSION-$platform"
            root="$RUNNER_TEMP/stage/$name"
            mkdir -p "$root"
            if [ "$extension" = zip ]; then
              unzip -q "$src_dir/$src" -d "$root"
            else
              tar -C "$root" -xzf "$src_dir/$src"
            fi
            test -f "$root/$lib"
            test -f "$root/include/arrow-adbc/driver/redshift.h"
            test -f "$root/LICENSE.txt"
            test -f "$root/NOTICE.txt"
            case "$platform" in
              windows-*) test -f "$root/THIRD_PARTY_LICENSES/libpq.txt" ;;
            esac

            python3 "$RUNNER_TEMP/release_readme.py" "$root/README.md"

            # The driver manager passes Driver.shared to dlopen()/LoadLibrary()
            # unchanged, so the path must be absolute and is filled in at install.
            manifest_lib="@PREFIX@/$lib"
            case "$platform" in windows-*) manifest_lib="${manifest_lib//\//\\}" ;; esac
            {
              echo "# ADBC driver manifest for the Redshift driver."
              echo "# Driver.shared must be an absolute path. Replace @PREFIX@ with the"
              echo "# absolute path of the directory that holds this file, then copy the"
              echo "# file into an ADBC driver search directory (for example one listed in"
              echo "# ADBC_DRIVER_PATH) to load the driver by the name \"redshift\"."
              echo "# README.md, section \"Load by name\", has the command for each OS."
              echo "manifest_version = 1"
              echo
              echo "name = 'ADBC Redshift Driver'"
              echo "version = '$VERSION'"
              echo "publisher = 'vahid110/arrow-adbc'"
              echo "license = 'Apache-2.0'"
              echo "url = 'https://github.com/vahid110/arrow-adbc'"
              echo
              echo "[ADBC]"
              echo "version = '1.1.0'"
              echo
              echo "[Driver]"
              echo "entrypoint = 'AdbcDriverRedshiftInit'"
              echo
              echo "[Driver.shared]"
              echo "$tuple = '$manifest_lib'"
            } > "$root/redshift.toml"

            pack "$RUNNER_TEMP/stage" "$name" "$out/$name.$extension"

            # Self-check: repacking the extracted archive gives the same bytes.
            recheck="$RUNNER_TEMP/recheck/$platform"
            mkdir -p "$recheck"
            if [ "$extension" = zip ]; then
              unzip -q "$out/$name.$extension" -d "$recheck"
            else
              tar -C "$recheck" -xzf "$out/$name.$extension"
            fi
            pack "$recheck" "$name" "$RUNNER_TEMP/recheck/$name.$extension"
            cmp "$out/$name.$extension" "$RUNNER_TEMP/recheck/$name.$extension"
            # Release archives never ship the development disclaimer.
            readme="$recheck/$name/README.md"
            grep -Fq "# ADBC Redshift driver $VERSION (" "$readme"
            if grep -Fn -e "not a production release" -e "development archive" "$readme"; then
              echo "::error::$name README still has the development disclaimer"
              exit 1
            fi
          done
          wheels=(downloaded-wheels/adbc_driver_redshift-"$PYTHON_VERSION"-py3-none-*.whl)
          test "${#wheels[@]}" -eq 5
          test "$(find downloaded-wheels -type f | wc -l)" -eq 5
          cp "${wheels[@]}" "$out/"
          (cd "$out" && sha256sum adbc-driver-redshift-*.tar.gz adbc-driver-redshift-*.zip \
            adbc_driver_redshift-*.whl > SHA256SUMS)
          (cd "$out" && sha256sum -c SHA256SUMS)
          test "$(wc -l < "$out/SHA256SUMS")" -eq 12
          cat "$out/SHA256SUMS"
          for archive in "$out"/*.tar.gz; do
            echo "== $(basename "$archive")"; tar -tzf "$archive"
          done
          for archive in "$out"/*.zip; do
            echo "== $(basename "$archive")"; unzip -Z1 "$archive"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adbc-driver-redshift-release-assets
          retention-days: 7
          if-no-files-found: error
          path: release-assets/

  manifest-load:
    name: Load ${{ matrix.platform }} driver by name
    runs-on: ${{ matrix.runner }}
    needs: [version, assemble]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu24-x86_64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-latest
          - platform: windows-x64
            runner: windows-latest
    env:
      PLATFORM: ${{ matrix.platform }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: adbc-driver-redshift-release-assets
          path: release-assets

      - name: Load the driver by name through redshift.toml (Linux, macOS)
        if: ${{ runner.os != 'Windows' }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install --yes libpq5
          else
            brew install --quiet libpq
          fi
          test_dir="$RUNNER_TEMP/manifest-test"
          mkdir -p "$test_dir/install" "$test_dir/drivers"
          tar -C "$test_dir/install" -xzf \
            "release-assets/adbc-driver-redshift-$VERSION-$PLATFORM.tar.gz"
          prefix="$test_dir/install/adbc-driver-redshift-$VERSION-$PLATFORM"
          # The command documented in the archive README ("Load by name").
          (cd "$prefix" && sed "s|'@PREFIX@/|'$PWD/|" redshift.toml > "$test_dir/drivers/redshift.toml")
          cat "$test_dir/drivers/redshift.toml"
          if grep -q "'@PREFIX@" "$test_dir/drivers/redshift.toml"; then exit 1; fi
          cc -std=c11 -Wall -Wextra -Werror -I "$prefix/include" \
            c/driver/pgwire/redshift_manifest_smoke.c -L "$prefix/lib" \
            -Wl,-rpath,"$prefix/lib" -ladbc_driver_manager -o "$test_dir/manifest_smoke"
          ADBC_DRIVER_PATH="$test_dir/drivers" "$test_dir/manifest_smoke" redshift

      - name: Load the driver by name through redshift.toml (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP "manifest-test"
          $drivers = Join-Path $testDir "drivers"
          New-Item -ItemType Directory -Force $drivers | Out-Null
          $zip = "release-assets\adbc-driver-redshift-$($env:VERSION)-$($env:PLATFORM).zip"
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $testDir "install")
          $prefix = Join-Path $testDir "install\adbc-driver-redshift-$($env:VERSION)-$($env:PLATFORM)"
          # The command documented in the archive README ("Load by name"):
          # backslash paths are literal in a TOML '...' string.
          Push-Location $prefix
          $manifest = (Get-Content -Raw redshift.toml).Replace("'@PREFIX@\", "'$((Get-Location).Path)\")
          [System.IO.File]::WriteAllText((Join-Path $drivers "redshift.toml"), $manifest)
          Pop-Location
          Get-Content (Join-Path $drivers "redshift.toml")
          if ((Get-Content -Raw (Join-Path $drivers "redshift.toml")).Contains("'@PREFIX@")) {
            throw "placeholder not replaced"
          }
          $build = Join-Path $testDir "build"
          cmake -S .\c\driver\pgwire\install_smoke -B $build -A x64 "-DCMAKE_PREFIX_PATH=$prefix"
          if ($LASTEXITCODE -ne 0) { throw "failed to configure the manifest client" }
          cmake --build $build --config Release --target adbc_redshift_manifest_smoke
          if ($LASTEXITCODE -ne 0) { throw "failed to build the manifest client" }
          $env:PATH = "$(Join-Path $prefix 'bin');$env:PATH"
          $env:ADBC_DRIVER_PATH = $drivers
          & (Join-Path $build "Release\adbc_redshift_manifest_smoke.exe") redshift
          if ($LASTEXITCODE -ne 0) { throw "could not load the driver by name" }

  release:
    name: Create draft GitHub Release
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    needs: [version, assemble, manifest-load]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: adbc-driver-redshift-release-assets
          path: release-assets

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PYTHON_VERSION: ${{ needs.version.outputs.python_version }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          notes="ADBC Redshift driver $VERSION.

          Each archive holds the Redshift driver library, its public header, the ADBC driver manager, LICENSE.txt,
          NOTICE.txt, a README and redshift.toml (an ADBC driver manifest; the
          README's 'Load by name' section shows how to install it).
          Windows archives add THIRD_PARTY_LICENSES for statically linked libpq.
          The adbc_driver_redshift-*.whl files are the Python package (version
          $PYTHON_VERSION) for manylinux x86_64/aarch64, macOS x86_64/arm64 and
          Windows x64; install one with pip (adbc-driver-manager comes from PyPI).
          Every library in an archive, including the bundled driver manager and
          PostgreSQL driver, is built as version $VERSION.
          Verify downloads with: sha256sum -c SHA256SUMS"
          # Always a draft: publishing is a manual, reviewed step.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            "${prerelease[@]}" \
            --title "ADBC Redshift driver $VERSION" \
            --notes "$notes" \
            SHA256SUMS adbc-driver-redshift-*.tar.gz adbc-driver-redshift-*.zip \
            adbc_driver_redshift-*.whl
